# Production stack for a single Ubuntu VPS. Bring up with:
#   docker compose -f docker-compose.prod.yml up -d --build
# All secrets/config come from the .env file next to this one (see .env.example).
#
# The web/bot `image:` names are registry-qualified so one file serves both
# deploy paths: `./deploy.sh` builds them here and tags them locally, while
# `./deploy.sh --pull` (what GitHub Actions runs) pulls the image CI already
# built for a given commit. IMAGE_TAG selects which commit; WEB_IMAGE/BOT_IMAGE
# let a fork point at its own registry from .env. Defaults keep a bare
# `docker compose up --build` working with no extra environment.

# Docker's default json-file driver grows without bound and will eventually fill
# the VPS disk, taking Postgres down with it. Every service caps its logs
# (AUDIT.md T5).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16
    container_name: serviokargo-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: Postgres is only reachable on the internal network.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/oyatillo12/servio-kargo-web}:${IMAGE_TAG:-latest}
    container_name: serviokargo-web
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Without this, a hung Next.js process keeps "running" forever and Docker
    # never restarts it (AUDIT.md T5). The image is debian-slim with no curl or
    # wget, so the probe uses Node's global fetch. /login renders without a
    # session, so a 200 means the render pipeline is actually alive.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # No published ports: Caddy proxies to it on the internal network.

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: ${BOT_IMAGE:-ghcr.io/oyatillo12/servio-kargo-bot}:${IMAGE_TAG:-latest}
    container_name: serviokargo-bot
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # The bot already serves GET /health; wire it up so a wedged process gets
    # restarted instead of silently accepting webhooks it never processes.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||8443)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    container_name: serviokargo-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - bot

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
