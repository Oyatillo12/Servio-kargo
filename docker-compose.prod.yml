# Production stack for a single Ubuntu VPS. Bring up with:
#   docker compose -f docker-compose.prod.yml up -d --build
# All secrets/config come from the .env file next to this one (see .env.example).

services:
  postgres:
    image: postgres:16
    container_name: serviokargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: Postgres is only reachable on the internal network.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: kargotrack-web
    container_name: serviokargo-web
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: Caddy proxies to it on the internal network.

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: kargotrack-bot
    container_name: serviokargo-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: serviokargo-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - bot

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
