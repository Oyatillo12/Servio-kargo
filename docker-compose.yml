services:
  postgres:
    image: postgres:18
    container_name: serviokargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kargotrack
      POSTGRES_PASSWORD: kargotrack
      POSTGRES_DB: kargotrack
    ports:
      - '5432:5432'
    volumes:
      - kargotrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kargotrack -d kargotrack']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kargotrack_pgdata:
